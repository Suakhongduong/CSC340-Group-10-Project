<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style.css">

    <title>HomeFix - Customer Profile</title>
</head>

<body>

    <nav class="site-nav">

        <a href="Customer Home.html" class="logo">
            HomeFix
        </a>

        <div class="nav-links">

            <a href="Customer Home.html">
                Home
            </a>

            <a href="Services.html">
                Services
            </a>

            <a href="Customer Profile.html" class="active">
                Profile
            </a>

            <a href="Appointments.html">
                Appointments
            </a>

            <a href="../index.html">
                Logout
            </a>

        </div>

    </nav>


    <main class="customer-page">

        <div class="customer-box">

            <span class="blue-label">
                MY PROFILE
            </span>

            <h1>
                Customer Profile
            </h1>

            <p>
                Your HomeFix account information.
            </p>


            <label for="profile-name">
                Full Name
            </label>

            <input
                type="text"
                id="profile-name"
                readonly
            >


            <label for="profile-email">
                Email
            </label>

            <input
                type="email"
                id="profile-email"
                readonly
            >


            <label for="profile-phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="profile-phone"
                readonly
            >


            <label for="profile-address">
                Home Address
            </label>

            <input
                type="text"
                id="profile-address"
                readonly
            >


            <label for="profile-city">
                City
            </label>

            <input
                type="text"
                id="profile-city"
                readonly
            >

        </div>

    </main>


    <script>

        document.getElementById("profile-name").value =
            localStorage.getItem("fullName") || "Not entered";

        document.getElementById("profile-email").value =
            localStorage.getItem("email") || "Not entered";

        document.getElementById("profile-phone").value =
            localStorage.getItem("phone") || "Not entered";

        document.getElementById("profile-address").value =
            localStorage.getItem("address") || "Not entered";

        document.getElementById("profile-city").value =
            localStorage.getItem("city") || "Not entered";

    </script>

</body>

</html>
