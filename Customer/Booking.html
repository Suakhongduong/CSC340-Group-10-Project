<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style.css">

    <title>HomeFix - Request Service</title>
</head>

<body>

    <nav class="site-nav">

        <a href="Customer Home.html" class="logo">
            HomeFix
        </a>

        <div class="nav-links">

            <a href="Customer Home.html">
                Home
            </a>

            <a href="Services.html">
                Services
            </a>

            <a href="Customer Profile.html">
                Profile
            </a>

            <a href="Appointments.html">
                Appointments
            </a>

        </div>

    </nav>


    <main class="booking-page">

        <div class="booking-card">

            <div class="page-title">

                <span class="blue-label">
                    REQUEST SERVICE
                </span>

                <h1>
                    Schedule a HomeFix service
                </h1>

                <p>
                    Provide a few details about your project.
                </p>

            </div>


            <div class="selected-provider">

                <div class="provider-initials">
                    MJ
                </div>

                <div>

                    <strong>
                        Marcus Johnson
                    </strong>

                    <p>
                        Licensed Plumber
                    </p>

                </div>

            </div>


            <form>

                <label>
                    Service Needed
                </label>

                <select>

                    <option>
                        Plumbing Repair
                    </option>

                    <option>
                        Drain Repair
                    </option>

                    <option>
                        Faucet Installation
                    </option>

                    <option>
                        Water Heater
                    </option>

                </select>


                <label>
                    Describe Your Project
                </label>

                <textarea
                    rows="5"
                    placeholder="Tell the professional what you need help with..."
                ></textarea>


                <label>
                    Preferred Date
                </label>

                <input
                    type="date"
                >


                <label>
                    Preferred Time
                </label>

                <select>

                    <option>
                        Select a time
                    </option>

                    <option>
                        9:00 AM
                    </option>

                    <option>
                        11:00 AM
                    </option>

                    <option>
                        1:00 PM
                    </option>

                    <option>
                        3:00 PM
                    </option>

                    <option>
                        5:00 PM
                    </option>

                </select>


                <div class="quote-summary">

                    <span>
                        Estimated starting rate
                    </span>

                    <strong>
                        $85/hr
                    </strong>

                </div>


                <a
                    href="Appointments.html"
                    class="main-button"
                >
                    Accept Quote & Schedule
                </a>

            </form>

        </div>

    </main>

</body>
</html>
