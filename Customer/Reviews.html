<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style.css">

    <title>Reviews</title>
</head>

<body>

    <nav>

        <a href="Customer Home.html" class="home">
            HomeFix
        </a>

        <a href="Customer Home.html">
            Home
        </a>

        <a href="Customer Profile.html">
            Profile
        </a>

    </nav>


    <div class="customer-page">

        <div class="customer-box">

            <h1>Leave a Review</h1>

            <p>Tell us about your experience.</p>


            <form>

                <label>Provider</label>

                <select>

                    <option>Select a provider</option>

                    <option>ABC Plumbing</option>

                    <option>Reliable Electric</option>

                    <option>HomeFix Handyman</option>

                </select>


                <label>Rating</label>

                <select>

                    <option>Select a rating</option>

                    <option>5 Stars</option>
                    <option>4 Stars</option>
                    <option>3 Stars</option>
                    <option>2 Stars</option>
                    <option>1 Star</option>

                </select>


                <label>Written Review</label>

                <textarea
                    placeholder="Write your review..."
                ></textarea>


                <button type="button">
                    Submit Review
                </button>

            </form>

        </div>

    </div>

</body>

</html>
