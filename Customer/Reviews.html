<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style.css">

    <title>HomeFix - Leave a Review</title>
</head>

<body>

    <nav class="site-nav">

        <a href="Customer Home.html" class="logo">
            HomeFix
        </a>

        <div class="nav-links">

            <a href="Customer Home.html">
                Home
            </a>

            <a href="Services.html">
                Services
            </a>

            <a href="Customer Profile.html">
                Profile
            </a>

            <a href="Appointments.html">
                Appointments
            </a>

        </div>

    </nav>


    <main class="review-page">

        <div class="review-card">

            <div class="page-title">

                <span class="blue-label">
                    YOUR EXPERIENCE
                </span>

                <h1>
                    Leave a Review
                </h1>

                <p>
                    Tell other HomeFix customers about
                    your experience.
                </p>

            </div>


            <div class="review-provider">

                <div class="provider-initials">
                    MJ
                </div>

                <div>

                    <strong>
                        Marcus Johnson
                    </strong>

                    <p>
                        Faucet Repair · September 12
                    </p>

                </div>

            </div>


            <form>

                <label>
                    Your Rating
                </label>

                <div class="rating-select">

                    <label>
                        <input
                            type="radio"
                            name="rating"
                        >
                        ★★★★★
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rating"
                        >
                        ★★★★☆
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="rating"
                        >
                        ★★★☆☆
                    </label>

                </div>


                <label>
                    Your Review
                </label>

                <textarea
                    rows="7"
                    placeholder="Share your experience..."
                ></textarea>


                <a
                    href="Appointments.html"
                    class="main-button"
                >
                    Submit Review
                </a>

            </form>

        </div>

    </main>

</body>
</html>
