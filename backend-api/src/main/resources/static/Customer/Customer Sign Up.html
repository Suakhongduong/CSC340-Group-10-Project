<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style.css">

    <title>HomeFix - Sign Up</title>
</head>

<body>

    <nav class="site-nav">

        <a href="../index.html" class="logo">
            HomeFix
        </a>

        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="../Get Started.html">
                Get Started
            </a>

        </div>

    </nav>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-heading">

                <span class="blue-label">
                    GET STARTED
                </span>

                <h1>
                    Create your HomeFix account
                </h1>

                <p>
                    Find trusted professionals for your
                    home repair and maintenance needs.
                </p>

            </div>


            <form id="signup-form">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >


                <label for="address">
                    Home Address
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter your home address"
                    required
                >


                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter your city"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    required
                >


                <button
                    type="submit"
                    class="main-button"
                >
                    Create Account
                </button>
                <p id="signup-message" role="status" aria-live="polite"></p>

            </form>


            <p class="form-note">
                By creating an account, you agree to use
                HomeFix responsibly.
            </p>

        </div>

    </main>


    
<script>
document.getElementById("signup-form").addEventListener("submit", async function(event) {
    event.preventDefault();

    console.log("Signup form submitted!");

    const message = document.getElementById("signup-message");

    // Get the information entered into the form.
    const fullName = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const city = document.getElementById("city").value.trim();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    // Make sure both password fields match.
    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    // Split the full name into first name and last name.
    const nameParts = fullName.split(/\s+/);

    if (nameParts.length < 2) {
        message.textContent = "Please enter your first and last name.";
        return;
    }

    // Create a customer object that matches our Java Customer entity.
    const customer = {
        firstName: nameParts[0],
        lastName: nameParts.slice(1).join(" "),
        email: email,
        phoneNumber: phone,
        address: address + ", " + city
    };

    try {
        // Send the customer information to our Spring Boot API.
        const response = await fetch("/api/customers", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(customer)
        });

        // Display an error if the backend rejects the request.
        if (!response.ok) {
            message.textContent = "Could not create account. Please check your information.";
            return;
        }

        // Convert the API response from JSON into a JavaScript object.
        const savedCustomer = await response.json();

        // Remember the customer ID so other pages can load their profile.
        sessionStorage.setItem("customerId", savedCustomer.customerId);

        // Display a success message and open the customer homepage.
        message.textContent = "Customer profile created successfully!";
        window.location.href = "Customer Home.html";

    } catch (error) {
        // Handle errors such as the server being unavailable.
        console.error("Registration error:", error);
        message.textContent = "Unable to connect to the server.";
    }
});
</script>


</body>

</html>
