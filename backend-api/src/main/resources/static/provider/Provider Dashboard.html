<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>HomeFix - Provider Dashboard</title>
    <style>
        .dashboard-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-action {
            background-color: blueviolet;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .service-box {
            border: 1px solid #e0e0e0;
            padding: 16px;
            border-radius: 8px;
            background: #fdfdfd;
        }
    </style>
</head>
<body>
    <nav>
        <span style="font-weight: bold; font-size: 18px;">HomeFix Provider Portal</span>
        <a href="../index.html" class="Login">Logout</a>
    </nav>

    <div class="dashboard-container">
        <!-- Profile settings form -->
        <div class="card">
            <h3>1. Provider Profile Settings</h3>
            <form id="profileForm">
                <div class="form-group">
                    <label>Business Name</label>
                    <input type="text" id="businessNameInput" required>
                </div>
                <div class="form-group">
                    <label>Specialty</label>
                    <select id="specialtySelect">
                        <option value="Electrical">Electrical</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Handyman">Handyman</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Hourly Rate ($/hr)</label>
                    <input type="number" step="0.01" id="hourlyRateInput" placeholder="e.g. 65">
                </div>
                <div class="form-group">
                    <label>Bio / Description</label>
                    <textarea id="bioInput" rows="2"></textarea>
                </div>
                <button type="submit" class="btn-action">Update Profile</button>
            </form>
        </div>

        <!-- Form to add a new repair service -->
        <div class="card">
            <h3>2. Post a New Repair Service</h3>
            <form id="serviceForm">
                <div class="form-group">
                    <label>Service Title</label>
                    <input type="text" id="serviceTitleInput" placeholder="e.g. Electrical Outlet & Panel Repair" required>
                </div>
                <div class="form-group">
                    <label>Price Rate ($/hr)</label>
                    <input type="number" step="0.01" id="servicePriceInput" placeholder="e.g. 65" required>
                </div>
                <div class="form-group">
                    <label>Service Description</label>
                    <textarea id="serviceDescInput" rows="2" placeholder="Describe what is included in this repair service..."></textarea>
                </div>
                <button type="submit" class="btn-action">Publish Service</button>
            </form>
        </div>

        <!-- Active services loaded from DB -->
        <div class="card">
            <h3>3. Your Active Services</h3>
            <div class="service-grid" id="activeServicesGrid">
                <p>Loading services...</p>
            </div>
        </div>
    </div>

    <script>
      // Get provider ID from URL (?id=1), default to 1
      const params = new URLSearchParams(window.location.search);
      let providerId = params.get('id') || 1;
      let providerData = {};
      let services = [];

      // Split bio text and saved services JSON stored inside the bio column
      function parseBioAndServices(rawBio) {
        if (!rawBio) return { bioText: '', list: [] };
        const marker = '\n---SERVICES---\n';
        if (rawBio.includes(marker)) {
          const parts = rawBio.split(marker);
          try {
            return { bioText: parts[0], list: JSON.parse(parts[1]) };
          } catch {
            return { bioText: parts[0], list: [] };
          }
        }
        return { bioText: rawBio, list: [] };
      }

      // Render service cards into the grid
      function renderServices() {
        const grid = document.getElementById('activeServicesGrid');
        if (!grid) return;

        if (services.length === 0) {
          grid.innerHTML = '<p>No services posted yet.</p>';
          return;
        }

        grid.innerHTML = services.map(s => `
          <div class="service-box">
            <h4>${s.title}</h4>
            <p><strong>Rate:</strong> $${s.rate}/hr</p>
            <p>${s.desc || ''}</p>
          </div>
        `).join('');
      }

      // Load provider profile and services from Neon DB
      async function loadDashboard() {
        try {
          const res = await fetch(`/api/providers/${providerId}`);
          if (!res.ok) {
            alert('Provider not found.');
            document.getElementById('activeServicesGrid').innerHTML = '<p>Provider not found.</p>';
            return;
          }
          const data = await res.json();
          providerData = data;

          document.getElementById('businessNameInput').value = data.name || '';
          document.getElementById('hourlyRateInput').value = data.hourlyRate ?? '';
          if (data.serviceType) {
            document.getElementById('specialtySelect').value = data.serviceType;
          }

          const parsed = parseBioAndServices(data.bio);
          document.getElementById('bioInput').value = parsed.bioText;
          services = parsed.list;
          renderServices();
        } catch (err) {
          console.error(err);
        }
      }

      // Save changes to backend using exact Provider entity fields
      async function syncProvider(updates) {
        const currentBio = updates.bio !== undefined
          ? updates.bio
          : document.getElementById('bioInput').value;

        const combinedBio = services.length > 0
          ? `${currentBio}\n---SERVICES---\n${JSON.stringify(services)}`
          : currentBio;

        const rateVal = updates.hourlyRate !== undefined
          ? updates.hourlyRate
          : parseFloat(document.getElementById('hourlyRateInput').value);

        const body = {
          name: updates.name || document.getElementById('businessNameInput').value || 'Provider',
          email: providerData.email || 'provider@homefix.com',
          serviceType: updates.serviceType || document.getElementById('specialtySelect').value || 'Electrical',
          hourlyRate: isNaN(rateVal) ? 65.0 : rateVal,
          bio: combinedBio
        };

        let res = await fetch(`/api/providers/${providerId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          res = await fetch('/api/providers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        }

        if (res.ok) {
          const saved = await res.json();
          providerData = saved;
          providerId = saved.id || providerId;
          window.history.replaceState({}, '', `?id=${providerId}`);
          return true;
        }
        return false;
      }

      // Handle profile settings update
      document.getElementById('profileForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ok = await syncProvider({
          name: document.getElementById('businessNameInput').value,
          serviceType: document.getElementById('specialtySelect').value,
          hourlyRate: parseFloat(document.getElementById('hourlyRateInput').value),
          bio: document.getElementById('bioInput').value
        });
        alert(ok ? 'Profile updated!' : 'Could not update profile.');
      });

      // Handle adding a new service
      document.getElementById('serviceForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const price = parseFloat(document.getElementById('servicePriceInput').value);
        services.push({
          title: document.getElementById('serviceTitleInput').value,
          rate: isNaN(price) ? 0 : price,
          desc: document.getElementById('serviceDescInput').value
        });

        const ok = await syncProvider({
          hourlyRate: isNaN(price) ? undefined : price
        });

        if (ok) {
          alert('Service published!');
          document.getElementById('serviceForm').reset();
          if (!isNaN(price)) document.getElementById('hourlyRateInput').value = price;
          renderServices();
        } else {
          services.pop();
          alert('Could not publish service.');
        }
      });

      document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
